[toolchain]
# Floor is 1.98: older toolchains produce proc-macro dylibs that macOS 27
# cannot load (see app/README.md "Rust toolchain version"). Must match the
# Rust version rules_rust defaults to in MODULE.bazel.
channel = "1.98.0"
components = ["rustfmt", "clippy", "rust-analyzer"]
profile = "minimal"
